name: Multi-platform Build of cppfront

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  # Restrict permissions to read-only for security
  contents: read

concurrency:
  # Specific group name to cancel in-progress builds for the same PR/ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: win-25 | cl.exe | c++latest | windows-2025
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '18'
      - name: Compiler name & version
        run: cl.exe
      - name: Build
        run: cl.exe source/cppfront.cpp -std:c++latest -MD -EHsc -W4 -WX

  build-unix-like:
    name: ${{ matrix.shortosname }} | ${{ matrix.compiler }} | ${{ matrix.cxx_std }} | ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        shortosname: [ubu-22]
        compiler: [g++-10, g++-11, g++-12, clang++-12, clang++-14]
        cxx_std: ['c++20', 'c++2b']
        exclude:
          # GCC 10 doesn't have support for c++23
          - compiler: g++-10
            cxx_std: 'c++2b'
          # Clang 12 and 14 do not compile on 'c++2b' due to llvm/llvm-project#58206
          - compiler: clang++-12
            cxx_std: 'c++2b'
          - compiler: clang++-14
            cxx_std: 'c++2b'
        include:
          - os: macos-14
            shortosname: mac-14
            compiler: clang++
            cxx_std: 'c++20'
          - os: macos-15
            shortosname: mac-15
            compiler: clang++
            cxx_std: 'c++20'
          - os: ubuntu-22.04
            shortosname: ubu-22
            compiler: clang++-15
            cxx_std: 'c++20'
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: clang++-16
            cxx_std: 'c++20'
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: clang++-17
            cxx_std: 'c++20'
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: clang++-18
            cxx_std: 'c++20'
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: clang++-18
            cxx_std: 'c++23'
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: g++-14
            cxx_std: 'c++2b'
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: -std=${{ matrix.cxx_std }} -Wall -Wextra -Wold-style-cast -Wunused-parameter -Wpedantic -Werror -pthread -Wno-unknown-warning -Wno-unknown-warning-option
    steps:
    - uses: actions/checkout@v7
    - name: Install compiler
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get install -y "${CXX/clang++-/clang-}"
    - name: Compiler name & version
      run: $CXX --version
    - name: Build
      run: $CXX source/cppfront.cpp $CXXFLAGS -o cppfront
